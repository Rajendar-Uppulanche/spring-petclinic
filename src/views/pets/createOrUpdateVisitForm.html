<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>
    <th:block th:if="${visit['new']}">New </th:block>
    Visit
  </h2>

  <form th:object="${visit}" class="form-horizontal add-visit-form-card" id="add-visit-form" method="post">
    <div class="form-group has-feedback">
      <input
        th:replace="~{fragments/inputField :: input ('owner', ${owner.firstName} + ' ' + ${owner.lastName}, '', 'readonly')}" />
      <input
        th:replace="~{fragments/inputField :: input ('pet', ${pet.name}, '', 'readonly')}" />
    </div>
    <div class="form-group has-feedback">
      <label class="col-sm-2 control-label">Appointment Date</label>
      <div class="col-sm-10">
        <input th:field="*{date}" type="date" class="form-control" />
        <span th:if="${#fields.hasErrors('date')}" th:errors="*{date}" class="help-inline"></span>
      </div>
    </div>
    <div class="form-group has-feedback">
      <label class="col-sm-2 control-label">Reason for Visit</label>
      <div class="col-sm-10">
        <input th:field="*{description}" class="form-control" />
        <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="help-inline"></span>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button th:with="text=${visit['new']} ? 'Add Visit' : 'Update Visit'"
          class="btn btn-primary add-visit-submit-button" type="submit" th:text="${text}">Add Visit</button>
        <a th:href="@{/owners/__${owner.id}__}" class="btn btn-default add-visit-cancel-link">Cancel</a>
      </div>
    </div>
  </form>

</body>
</html>
