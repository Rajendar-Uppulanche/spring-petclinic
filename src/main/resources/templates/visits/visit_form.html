<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'visits')}" xmlns:th="http://www.thymeleaf.org">

<body>

  <h2>
    <th:block th:if="${visit['new']}">New </th:block>
    Visit
  </h2>

  <form th:object="${visit}" class="form-horizontal" id="add-visit-form" method="post">
    <div class="form-group has-feedback">
      <input
        th:replace="~{fragments/inputField :: input ('Owner', 'owner', 'text', ${owner.firstName + ' ' + owner.lastName}, true)}" />
      <input
        th:replace="~{fragments/inputField :: input ('Pet', 'pet', 'text', ${pet.name}, true)}" />
      <input
        th:replace="~{fragments/inputField :: input ('Appointment Date', 'date', 'date')}" />
      <input
        th:replace="~{fragments/inputField :: input ('Reason for Visit', 'description', 'text')}" />
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button th:with="text=${visit['new'] ? 'Add Visit' : 'Update Visit'}"
          class="btn btn-default" type="submit" th:text="${text}">Add
          Visit</button>
      </div>
    </div>
  </form>

</body>
</html>
