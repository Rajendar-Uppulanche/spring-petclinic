<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
          th:replace="~{fragments/layout :: layout (~{::body},'appointments')}">

<body>

    <h2>Appointments</h2>

    <form th:object="${filterCriteria}" class="form-horizontal" id="filter-appointment-form" method="get">
        <div class="form-group">
            <div class="control-group" id="ownerLastNameGroup">
                <label class="col-sm-2 control-label">Owner Last Name </label>
                <div class="col-sm-10">
                    <input class="form-control" th:field="*{ownerLastName}" size="30" maxlength="80"/>
                </div>
            </div>
            <div class="control-group" id="petNameGroup">
                <label class="col-sm-2 control-label">Pet Name </label>
                <div class="col-sm-10">
                    <input class="form-control" th:field="*{petName}" size="30" maxlength="80"/>
                </div>
            </div>
            <div class="control-group" id="statusGroup">
                <label class="col-sm-2 control-label">Status </label>
                <div class="col-sm-10">
                    <select class="form-control" th:field="*{status}">
                        <option value="">-- Select Status --</option>
                        <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option>
                    </select>
                </div>
            </div>
            <div class="control-group" id="startDateTimeGroup">
                <label class="col-sm-2 control-label">From Date/Time </label>
                <div class="col-sm-10">
                    <input type="datetime-local" class="form-control" th:field="*{startDateTime}"/>
                </div>
            </div>
            <div class="control-group" id="endDateTimeGroup">
                <label class="col-sm-2 control-label">To Date/Time </label>
                <div class="col-sm-10">
                    <input type="datetime-local" class="form-control" th:field="*{endDateTime}"/>
                </div>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-default">Find Appointments</button>
            </div>
        </div>
    </form>

    <table id="appointments" class="table table-striped">
        <thead>
        <tr>
            <th>Date/Time</th>
            <th>Pet Name</th>
            <th>Owner Name</th>
            <th>Description</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="appointment : ${appointments}">
            <td th:text="${#temporals.format(appointment.appointmentDateTime, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${appointment.pet.name}"></td>
            <td th:text="${appointment.pet.owner.firstName + ' ' + appointment.pet.owner.lastName}"></td>
            <td th:text="${appointment.description}"></td>
            <td th:text="${appointment.status}"></td>
        </tr>
        </tbody>
    </table>

</body>
</html>
