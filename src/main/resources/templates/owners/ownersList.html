<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

  <body>

    <h2>Owners</h2>

    <table id="owners" class="table table-striped">
      <thead>
      <tr>
        <th style="width: 150px;">Name</th>
        <th style="width: 200px;">Address</th>
        <th style="width: 120px;">City</th>
        <th style="width: 120px;">Telephone</th>
        <th>Pets</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="owner : ${listOwners}">
        <td>
          <a th:href="@{/owners/__${owner.id}__}" th:text="${owner.firstName + ' ' + owner.lastName}"></a>
        </td>
        <td th:text="${owner.address}"></td>
        <td th:text="${owner.city}"></td>
        <td th:text="${owner.telephone}"></td>
        <td>
          <span th:each="pet : ${owner.pets}" th:text="${pet.name + ' '}"></span>
        </td>
      </tr>
      </tbody>
    </table>

    <div th:if="${totalPages > 1}" class="text-center">
      <ul class="pagination">
        <li th:class="${currentPage == 1} ? 'disabled'">
          <a th:href="@{/owners(page=${currentPage - 1},lastName=${owner.lastName})}">&laquo;</a>
        </li>
        <li th:each="i : ${#numbers.sequence(1, totalPages)}" th:class="${currentPage == i} ? 'active'">
          <a th:href="@{/owners(page=${i},lastName=${owner.lastName})}" th:text="${i}"></a>
        </li>
        <li th:class="${currentPage == totalPages} ? 'disabled'">
          <a th:href="@{/owners(page=${currentPage + 1},lastName=${owner.lastName})}">&raquo;</a>
        </li>
      </ul>
    </div>

  </body>
</html>
