<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'owners')}" xmlns:th="https://www.thymeleaf.org">

<body>

	<h2>Owners</h2>

	<table id="owners" class="table table-striped-custom">
		<thead>
			<tr>
				<th style="width: 150px;">Name</th>
				<th style="width: 200px;">Address</th>
				<th style="width: 120px;">City</th>
				<th style="width: 120px;">Telephone</th>
				<th>Pets</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="owner : ${listOwners}">
				<td>
					<a th:href="@{/owners/__${owner.id}__}" th:text="${owner.firstName + ' ' + owner.lastName}"></a>
				</td>
				<td th:text="${owner.address}"></td>
				<td th:text="${owner.city}"></td>
				<td th:text="${owner.telephone}"></td>
				<td>
					<span th:each="pet : ${owner.pets}" th:text="${pet.name + ' '}"></span>
				</td>
			</tr>
		</tbody>
	</table>

	<div class="text-center">
		<ul class="pagination">
			<li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
				<a class="page-link" th:href="@{/owners(page=${currentPage - 1}, lastName=${owner.lastName})}"
					aria-label="Previous">
					<span aria-hidden="true">&laquo;</span>
					<span class="sr-only">Previous</span>
				</a>
			</li>
			<li class="page-item disabled">
				<a class="page-link" href="#" th:text="${currentPage} + ' of ' + ${totalPages}"></a>
			</li>
			<li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
				<a class="page-link" th:href="@{/owners(page=${currentPage + 1}, lastName=${owner.lastName})}"
					aria-label="Next">
					<span aria-hidden="true">&raquo;</span>
					<span class="sr-only">Next</span>
				</a>
			</li>
		</ul>
	</div>

</body>

</html>
