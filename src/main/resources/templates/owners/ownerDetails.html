<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'owner')}" xmlns:th="https://www.thymeleaf.org">

<body>

  <h2>Owner Information</h2>


  <table class="table table-striped" th:object="${owner}">
    <tr>
      <th>Name</th>
      <td><b th:text="${owner.firstName + ' ' + owner.lastName}"></b></td>
    </tr>
    <tr>
      <th>Address</th>
      <td th:text="${owner.address}" />
    </tr>
    <tr>
      <th>City</th>
      <td th:text="${owner.city}" />
    </tr>
    <tr>
      <th>Telephone</th>
      <td th:text="${owner.telephone}" />
    </tr>
  </table>

  <a th:href="@{/owners/{ownerId}/edit(ownerId=${owner.id})}" class="btn btn-default">Edit
    Owner</a>
  <a th:href="@{/owners/{ownerId}/pets/new(ownerId=${owner.id})}" class="btn btn-default">Add New
    Pet</a>

  <br />
  <br />
  <br />
  <h2>Pets and Visits</h2>

  <div th:each="pet : ${owner.pets}">
    <table class="table table-striped" th:object="${pet}">
      <tr>
        <td valign="top">
          <dl class="dl-horizontal">
            <dt>Name</dt>
            <dd th:text="${pet.name}" />
            <dt>Birth Date</dt>
            <dd th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}" />
            <dt>Type</dt>
            <dd th:text="${pet.type.name}" />
          </dl>
        </td>
        <td valign="top">
          <table class="table-condensed">
            <thead>
              <tr>
                <th>Visit Date</th>
                <th>Description</th>
                <th>Check-in Time</th>
                <th>Check-out Time</th>
                <th>Duration</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tr th:each="visit : ${pet.visits}">
              <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
              <td th:text="${visit.description}"></td>
              <td th:text="${visit.checkInTime != null ? #temporals.format(visit.checkInTime, 'yyyy-MM-dd HH:mm') : 'N/A'}"></td>
              <td th:text="${visit.checkOutTime != null ? #temporals.format(visit.checkOutTime, 'yyyy-MM-dd HH:mm') : 'N/A'}"></td>
              <td th:text="${visit.durationFormatted}"></td>
              <td>
                <form th:if="${!visit.checkedIn}" th:action="@{/owners/{ownerId}/pets/{petId}/visits/{visitId}/check_in(ownerId=${owner.id}, petId=${pet.id}, visitId=${visit.id})}" method="post">
                  <button type="submit" class="btn btn-sm btn-success">Check In</button>
                </form>
                <form th:if="${visit.checkedIn and !visit.checkedOut}" th:action="@{/owners/{ownerId}/pets/{petId}/visits/{visitId}/check_out(ownerId=${owner.id}, petId=${pet.id}, visitId=${visit.id})}" method="post">
                  <button type="submit" class="btn btn-sm btn-warning">Check Out</button>
                </form>
              </td>
            </tr>
          </table>
          <a th:href="@{/owners/{ownerId}/pets/{petId}/visits/new(ownerId=${owner.id},petId=${pet.id})}"
            class="btn btn-default">Add New Visit</a>
        </td>
      </tr>
    </table>
  </div>

</body>

</html>
