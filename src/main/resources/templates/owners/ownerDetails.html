<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'owner')}" xmlns:th="https://www.thymeleaf.org">

<body>

    <h2>Owner Information</h2>

    <table class="table table-striped" th:object="${owner}">
        <tr>
            <th>Name</th>
            <td><b th:text="*{firstName + ' ' + lastName}"></b></td>
        </tr>
        <tr>
            <th>Address</th>
            <td th:text="*{address}"></td>
        </tr>
        <tr>
            <th>City</th>
            <td th:text="*{city}"></td>
        </tr>
        <tr>
            <th>Telephone</th>
            <td th:text="*{telephone}"></td>
        </tr>
    </table>

    <a th:href="@{/owners/__${owner.id}__/edit}" class="btn btn-default">Edit Owner</a>
    <a th:href="@{/owners/__${owner.id}__/pets/new}" class="btn btn-default">Add New Pet</a>

    <br/>
    <br/>
    <h2>Pets and Visits</h2>

    <table class="table table-striped">
        <thead>
        <tr>
            <th style="width: 150px;">Name</th>
            <th style="width: 200px;">Birth Date</th>
            <th style="width: 100px;">Type</th>
            <th></th> <!-- For edit/visit links -->
        </tr>
        </thead>
        <tbody>
        <tr th:each="pet : ${owner.pets}">
            <td>
                <span th:text="${pet.name}"></span>
                <span th:text="${pet.visitCountString}" class="badge badge-info ml-2"></span>
            </td>
            <td th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></td>
            <td th:text="${pet.type.name}"></td>
            <td>
                <a th:href="@{/owners/__${owner.id}__/pets/__${pet.id}__/edit}" class="btn btn-default">Edit Pet</a>
                <a th:href="@{/owners/__${owner.id}__/pets/__${pet.id}__/visits/new}" class="btn btn-default">Add Visit</a>
            </td>
        </tr>
        </tbody>
    </table>

</body>
</html>
