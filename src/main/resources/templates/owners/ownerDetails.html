<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'owners')}" xmlns:th="https://www.thymeleaf.org">

<body>

	<h2>Owner Information</h2>


	<table class="table table-striped" th:object="${owner}">
		<tr>
			<th>Name</th>
			<td><b th:text="*{firstName + ' ' + lastName}"></b></td>
		</tr>
		<tr>
			<th>Address</th>
			<td th:text="*{address}"></td>
		</tr>
		<tr>
			<th>City</th>
			<td th:text="*{city}"></td>
		</tr>
		<tr>
			<th>Telephone</th>
			<td th:text="*{telephone}"></td>
		</tr>
	</table>

	<a th:href="@{/owners/{ownerId}/edit(ownerId=${owner.id})}" class="btn btn-info">Edit Owner</a>
	<a th:href="@{/owners/{ownerId}/pets/new(ownerId=${owner.id})}" class="btn btn-success">Add New Pet</a>
	<br />
	<br />
	<h2>Pets and Visits</h2>

	<table class="table table-striped">
		<thead>
			<tr>
				<th>Name</th>
				<th>Birth Date</th>
				<th>Type</th>
				<th>Visits</th>
			</tr>
		</thead>
		<tr th:each="pet : ${owner.pets}">
			<td th:text="${pet.name}"></td>
			<td>
				<span th:text="${#temporals.format(pet.birthDate, 'yyyy/MM/dd')}"></span>
				(<span th:text="${petAges.get(pet.id)}" class="text-muted font-italic"></span>)
			</td>
			<td th:text="${pet.type.name}"></td>
			<td>
				<table class="table-condensed">
					<tr th:each="visit : ${pet.visits}">
						<td th:text="${#temporals.format(visit.date, 'yyyy/MM/dd')}"></td>
						<td th:text="${visit.description}"></td>
					</tr>
					<tr>
						<td><a th:href="@{/owners/{ownerId}/pets/{petId}/visits/new(ownerId=${owner.id},petId=${pet.id})}"
								class="btn btn-info">Add Visit</a></td>
					</tr>
				</table>
			</td>
		</tr>
	</table>

</body>
</html>
