<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

	<h2>Owner Information</h2>


	<table class="table table-striped" th:object="${owner}">
		<tr>
			<th>Name</th>
			<td><b th:text="*{firstName + ' ' + lastName}"></b></td>
		</tr>
		<tr>
			<th>Address</th>
			<td th:text="*{address}" />
		</tr>
		<tr>
			<th>City</th>
			<td th:text="*{city}" />
		</tr>
		<tr>
			<th>Telephone</th>
			<td th:text="*{telephone}" />
		</tr>
	</table>

	<h2>Pets and Visits</h2>

	<table class="table table-striped">
		<tr th:each="pet : ${owner.pets}">
			<td valign="top">
				<dl class="dl-horizontal">
					<dt>Name</dt>
					<dd th:text="${pet.name}" />
					<dt>Birth Date</dt>
					<dd th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}" />
					<dt>Type</dt>
					<dd th:text="${pet.type.name}" />
				</dl>
			</td>
			<td valign="top">
				<table class="table-condensed">
					<thead>
						<tr>
							<th>Visit Date</th>
							<th>Description</th>
							<th>Weight</th>
						</tr>
					</thead>
					<tr th:each="visit : ${pet.visits}">
						<td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}" />
						<td th:text="${visit.description}" />
						<td>
							<span th:if="${visit.weight != null}" th:text="${#numbers.formatDecimal(visit.weight, 1, 2) + ' kg'}"></span>
						</td>
					</tr>
					<tr>
						<td><a th:href="@{/owners/__${owner.id}__/pets/__${pet.id}__/visits/new}">Add Visit</a></td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</body>

</html>
