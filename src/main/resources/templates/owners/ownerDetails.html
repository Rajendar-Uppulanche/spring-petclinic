<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>Owner Information</h2>


  <table class="table table-striped" th:object="${owner}">
    <tr>
      <th>Name</th>
      <td th:text="|*{firstName} *{lastName}|"></td>
    </tr>
    <tr>
      <th>Address</th>
      <td th:text="*{address}"></td>
    </tr>
    <tr>
      <th>City</th>
      <td th:text="*{city}"></td>
    </tr>
    <tr>
      <th>Telephone</th>
      <td th:text="*{telephone}"></td>
    </tr>
  </table>

  <a th:href="@{/owners/{ownerId}/edit(ownerId=${owner.id})}" class="btn btn-info">Edit Owner</a>
  <a th:href="@{/owners/{ownerId}/pets/new(ownerId=${owner.id})}" class="btn btn-success">Add New Pet</a>

  <br/>
  <br/>
  <h2>Pets and Visits</h2>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>Name</th>
        <th>Birth Date</th>
        <th>Type</th>
        <th>Visits</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="pet : ${owner.pets}">
        <td th:text="${pet.name}"></td>
        <td th:text="${#temporals.format(pet.birthDate, 'yyyy/MM/dd')}"></td>
        <td th:text="${pet.typeName}"></td>
        <td>
          <span th:if="${pet.visitCount == 0}">0 visits</span>
          <span th:if="${pet.visitCount > 0}" th:text="${pet.visitCount} + ' visits'"></span>
        </td>
        <td>
          <a th:href="@{/owners/{ownerId}/pets/{petId}/edit(ownerId=${owner.id}, petId=${pet.id})}" class="btn btn-info">Edit Pet</a>
          <a th:href="@{/owners/{ownerId}/pets/{petId}/visits/new(ownerId=${owner.id}, petId=${pet.id})}" class="btn btn-success">Add Visit</a>
        </td>
      </tr>
    </tbody>
  </table>

</body>
</html>
