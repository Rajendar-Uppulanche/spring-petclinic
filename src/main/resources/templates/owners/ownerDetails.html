<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'owner')}" xmlns:th="https://www.thymeleaf.org">

<body>

  <h2>Owner Information</h2>


  <table class="table table-striped" th:object="${owner}">
    <tr>
      <th>Name</th>
      <td><b th:text="*{firstName + ' ' + lastName}"></b></td>
    </tr>
    <tr>
      <th>Address</th>
      <td th:text="*{address}" />
    </tr>
    <tr>
      <th>City</th>
      <td th:text="*{city}" />
    </tr>
    <tr>
      <th>Telephone</th>
      <td th:text="*{telephone}" />
    </tr>
  </table>

  <h2>Pets and Visits</h2>

  <table class="table table-striped">
    <thead>
      <tr>
        <th style="width: 150px;">Name</th>
        <th style="width: 200px;">Birth Date</th>
        <th style="width: 100px;">Type</th>
        <th style="width: 200px;">Visits</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="pet : ${owner.pets}">
        <td th:text="${pet.name}"></td>
        <td>
          <span th:text="${#temporals.format(pet.birthDate, 'yyyy/MM/dd')}"></span>
          <span th:if="${pet.birthDate != null}" th:text="' (' + ${pet.age} + ')'"></span>
        </td>
        <td th:text="${pet.type.name}"></td>
        <td>
          <table class="table-condensed">
            <tr th:each="visit : ${pet.visits}">
              <td th:text="${#temporals.format(visit.date, 'yyyy/MM/dd')}"></td>
              <td th:text="${visit.description}"></td>
            </tr>
          </table>
        </td>
      </tr>
    </tbody>
  </table>

  <a th:href="@{/owners/{ownerId}/pets/new(ownerId=${owner.id})}" class="btn btn-default">Add New Pet</a>
  <a th:href="@{/owners/{ownerId}/edit(ownerId=${owner.id})}" class="btn btn-default">Edit Owner</a>
  <a th:href="@{/owners}" class="btn btn-default">Back to Owners</a>

</body>
</html>
