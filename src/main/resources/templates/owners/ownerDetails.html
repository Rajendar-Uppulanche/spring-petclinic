<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'owner')}" xmlns:th="https://www.thymeleaf.org">

<body>

  <h2>Owner Information</h2>


  <table class="table table-striped" th:object="${owner}">
    <tr>
      <th>Name</th>
      <td th:text="*{firstName + ' ' + lastName}" />
    </tr>
    <tr>
      <th>Address</th>
      <td th:text="*{address}" />
    </tr>
    <tr>
      <th>City</th>
      <td th:text="*{city}" />
    </tr>
    <tr>
      <th>Telephone</th>
      <td th:text="*{telephone}" />
    </tr>
  </table>

  <a th:href="@{/owners/__${owner.id}__/edit}" class="btn btn-default">Edit Owner</a>
  <a th:href="@{/owners/__${owner.id}__/pets/new}" class="btn btn-default">Add New Pet</a>
  <br />
  <br />
  <br />
  <h2>Pets and Visits</h2>

  <div class="table-responsive">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Name</th>
          <th>Birth Date</th>
          <th>Type</th>
          <th>Visits</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="pet : ${owner.pets}">
          <td th:text="${pet.name}"></td>
          <td th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></td>
          <td th:text="${pet.type.name}"></td>
          <td>
            <table class="table-condensed">
              <tr th:each="visit : ${pet.visits}">
                <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
                <td th:text="${visit.description}"></td>
              </tr>
              <tr>
                <td><a th:href="@{/owners/__${owner.id}__/pets/__${pet.id}__/visits/new}">Add Visit</a></td>
              </tr>
            </table>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <h3>Visit History Filter</h3>
  <div class="form-inline mb-3">
    <div class="form-group mr-2">
      <label for="fromDate" class="mr-1">From Date:</label>
      <input type="date" id="fromDate" class="form-control" />
    </div>
    <div class="form-group mr-2">
      <label for="toDate" class="mr-1">To Date:</label>
      <input type="date" id="toDate" class="form-control" />
    </div>
    <div class="form-group mr-2">
      <label for="keyword" class="mr-1">Keyword:</label>
      <input type="text" id="keyword" class="form-control" placeholder="Search description" />
    </div>
    <button id="applyFilters" class="btn btn-primary mr-2">Apply Filters</button>
    <button id="clearFilters" class="btn btn-secondary">Clear Filters</button>
  </div>

  <h3>Filtered Visit History</h3>
  <div class="table-responsive">
    <table class="table table-striped" id="filteredVisitsTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Pet Name</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody id="filteredVisitsBody">
        <!-- Filtered visits will be loaded here by JavaScript -->
      </tbody>
    </table>
    <p id="noVisitsMessage" style="display: none;">No visits found matching the criteria.</p>
  </div>

  <script th:src="@{/resources/js/visit-history.js}"></script>
  <script th:inline="javascript">
    /*<![CDATA[*/
    const ownerId = [[${owner.id}]];
    document.addEventListener('DOMContentLoaded', () => {
      initVisitHistory(ownerId);
    });
    /*]]>*/
  </script>

</body>

</html>
