<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'owners')}" xmlns:th="https://www.thymeleaf.org">

<body>

    <h2>Owner Information</h2>


    <table class="table table-striped" th:object="${owner}">
        <tr>
            <th>Name</th>
            <td th:text="*{firstName + ' ' + lastName}"></td>
        </tr>
        <tr>
            <th>Address</th>
            <td th:text="*{address}"></td>
        </tr>
        <tr>
            <th>City</th>
            <td th:text="*{city}"></td>
        </tr>
        <tr>
            <th>Telephone</th>
            <td th:text="*{telephone}"></td>
        </tr>
    </table>

    <a th:href="@{/owners/{ownerId}/edit(ownerId=${owner.id})}" class="btn btn-primary">Edit Owner</a>
    <a th:href="@{/owners/{ownerId}/pets/new(ownerId=${owner.id})}" class="btn btn-primary">Add New Pet</a>

    <br/>
    <br/>
    <h2>Pets and Visits</h2>

    <table class="table table-striped">
        <thead>
        <tr>
            <th style="width: 150px;">Name</th>
            <th style="width: 200px;">Birth Date</th>
            <th style="width: 100px;">Type</th>
            <th style="width: 200px;">Visits</th>
            <th style="width: 120px;"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pet : ${owner.pets}">
            <td th:text="${pet.name}"></td>
            <td th:text="${#temporals.format(pet.birthDate, 'yyyy/MM/dd')}"></td>
            <td th:text="${pet.type.name}"></td>
            <td>
                <span th:if="${pet.visitCount > 0}" class="badge badge-pill badge-info" th:text="|${pet.visitCount} visit(s)|">3 visit(s)</span>
                <span th:if="${pet.visitCount == 0}" class="badge badge-pill badge-secondary">No visits</span>
            </td>
            <td>
                <a th:href="@{/owners/{ownerId}/pets/{petId}/edit(ownerId=${owner.id},petId=${pet.id})}"
                   class="btn btn-primary">Edit Pet</a>
                <a th:href="@{/owners/{ownerId}/pets/{petId}/visits/new(ownerId=${owner.id},petId=${pet.id})}"
                   class="btn btn-primary">Add Visit</a>
            </td>
        </tr>
        </tbody>
    </table>

</body>
</html>
