<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>Owner Information</h2>


  <table class="table table-striped" th:object="${owner}">
    <tr>
      <th>Name</th>
      <td><b th:text="${owner.firstName + ' ' + owner.lastName}"></b></td>
    </tr>
    <tr>
      <th>Address</th>
      <td th:text="${owner.address}" />
    </tr>
    <tr>
      <th>City</th>
      <td th:text="${owner.city}" />
    </tr>
    <tr>
      <th>Telephone</th>
      <td th:text="${owner.telephone}" />
    </tr>
  </table>

  <a th:href="@{/owners/{ownerId}/edit(ownerId=${owner.id})}" class="btn btn-default">Edit
    Owner</a>
  <a th:href="@{/owners/{ownerId}/pets/new(ownerId=${owner.id})}" class="btn btn-default">Add New Pet</a>
  <br />
  <br />
  <br />
  <h2>Pets and Visits</h2>

  <table class="table table-striped">
    <thead>
      <tr>
        <th style="width: 150px;">Name</th>
        <th style="width: 200px;">Birth Date</th>
        <th style="width: 100px;">Type</th>
        <th style="width: 150px;">Visits</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="pet : ${owner.pets}">
        <td th:text="${pet.name}"></td>
        <td th:text="${#temporals.format(pet.birthDate, 'yyyy/MM/dd')}"></td>
        <td th:text="${pet.type.name}"></td>
        <td>
          <span th:if="${pet.visitCount > 0}" th:text="${pet.visitCount + ' visit(s)'}" class="visit-count-badge badge badge-info"></span>
          <span th:if="${pet.visitCount == 0}" class="visit-count-badge badge badge-secondary">No visits</span>
        </td>
        <td>
          <a th:href="@{/owners/{ownerId}/pets/{petId}/edit(ownerId=${owner.id},petId=${pet.id})}">Edit Pet</a>
        </td>
        <td>
          <a th:href="@{/owners/{ownerId}/pets/{petId}/visits/new(ownerId=${owner.id},petId=${pet.id})}">Add
            Visit</a>
        </td>
      </tr>
    </tbody>
  </table>

</body>

</html>
