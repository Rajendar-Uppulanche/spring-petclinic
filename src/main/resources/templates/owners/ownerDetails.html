<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>Owner Information</h2>


  <table class="table table-striped" th:object="${owner}">
    <tr>
      <th>Name</th>
      <td><b th:text="*{firstName + ' ' + lastName}"></b></td>
    </tr>
    <tr>
      <th>Address</th>
      <td th:text="*{address}" />
    </tr>
    <tr>
      <th>City</th>
      <td th:text="*{city}" />
    </tr>
    <tr>
      <th>Telephone</th>
      <td th:text="*{telephone}" />
    </tr>
  </table>

  <a th:href="@{__${owner.id}__/edit}" class="btn btn-default">Edit Owner</a>
  <a th:href="@{__${owner.id}__/pets/new}" class="btn btn-default">Add New Pet</a>

  <br/>
  <br/>
  <br/>
  <h2>Pets and Visits</h2>

  <table class="table table-striped">
    <thead>
      <tr>
        <th style="width: 150px;">Name</th>
        <th style="width: 200px;">Birth Date</th>
        <th style="width: 120px;">Type</th>
        <th style="width: 150px;">Visits</th>
        <th style="width: 120px;"></th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="petWithVisitCount : ${petsWithVisitCounts}">
        <td th:text="${petWithVisitCount.pet.name}"></td>
        <td th:text="${#temporals.format(petWithVisitCount.pet.birthDate, 'yyyy/MM/dd')}"></td>
        <td th:text="${petWithVisitCount.pet.type.name}"></td>
        <td>
          <span class="badge badge-info" th:classappend="${petWithVisitCount.visitCount == 0} ? 'badge-secondary' : ''">
            <span th:if="${petWithVisitCount.visitCount == 0}">No visits</span>
            <span th:if="${petWithVisitCount.visitCount == 1}">1 visit</span>
            <span th:if="${petWithVisitCount.visitCount > 1}" th:text="${petWithVisitCount.visitCount + ' visits'}"></span>
          </span>
        </td>
        <td>
          <a th:href="@{__${owner.id}__/pets/__${petWithVisitCount.pet.id}__/edit}" class="btn btn-default">Edit Pet</a>
        </td>
      </tr>
    </tbody>
  </table>

</body>
</html>
