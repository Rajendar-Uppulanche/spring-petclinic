<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'owners')}" xmlns:th="https://www.thymeleaf.org">

<body>

  <h2>Owner Information</h2>


  <table class="table table-striped" th:object="${owner}">
    <tr>
      <th>Name</th>
      <td th:text="*{firstName + ' ' + lastName}"></td>
    </tr>
    <tr>
      <th>Address</th>
      <td th:text="*{address}"></td>
    </tr>
    <tr>
      <th>City</th>
      <td th:text="*{city}"></td>
    </tr>
    <tr>
      <th>Telephone</th>
      <td th:text="*{telephone}"></td>
    </tr>
  </table>

  <a th:href="@{/owners/__${owner.id}__/edit}" class="btn btn-info">Edit Owner</a>
  <a th:href="@{/owners/__${owner.id}__/pets/new}" class="btn btn-success">Add New Pet</a>

  <br />
  <br />
  <br />
  <h2>Pets and Visits</h2>

  <table class="table table-striped">
    <thead>
      <tr>
        <th style="width: 150px;">Name</th>
        <th style="width: 200px;">Birth Date</th>
        <th style="width: 120px;">Type</th>
        <th style="width: 150px;">Visits</th>
      </tr>
    </thead>
    <tr th:each="pet : ${owner.pets}">
      <td th:text="${pet.name}"></td>
      <td>
        <span th:text="${pet.birthDate}"></span>
        <span th:if="${pet.ageString}" th:text="${pet.ageString}" class="pet-age"></span>
      </td>
      <td th:text="${pet.type.name}"></td>
      <td>
        <table class="table-condensed">
          <tr th:each="visit : ${pet.visits}">
            <td th:text="${visit.date}"></td>
            <td th:text="${visit.description}"></td>
          </tr>
          <tr>
            <td><a th:href="@{/owners/__${owner.id}__/pets/__${pet.id}__/visits/new}">Add Visit</a></td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

</body>
</html>
