<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{owner.search.title}">Search Owner</title>
</head>
<body>
<div class="container">
    <h2 th:text="#{owner.search.title}">Search Owner</h2>
    <form th:object="${owner}" th:action="@{/owners}" method="get" class="form-horizontal">
        <div class="form-group">
            <div class="control-group" id="lastNameGroup">
                <label class="col-sm-2 control-label" th:text="#{owner.search.lastName}" for="lastName">Last name </label>
                <div class="col-sm-10">
                    <input class="form-control" th:field="*{lastName}" size="30" maxlength="80"/>
                    <span class="help-inline" th:errors="*{lastName}">[Error]</span>
                </div>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-default" th:text="#{owner.search.button}">Search Owner</button>
            </div>
        </div>
    </form>
    <br/>
    <a class="btn btn-default" th:href="@{/owners/new}">Add Owner</a>
</div>
</body>
</html>
