<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>Find Owners</h2>

  <form th:object="${owner}" th:action="@{/owners}" method="get" class="form-horizontal" id="search-owner-form">
    <div class="form-group">
      <div class="control-group" id="lastNameGroup">
        <label class="col-sm-2 control-label">Last name </label>
        <div class="col-sm-10">
          <input class="form-control" th:field="*{lastName}" size="30" maxlength="80" />
          <span class="help-inline"><div th:if="${#fields.hasErrors('lastName')}">
            <p th:each="err : ${#fields.errors('lastName')}" th:text="${err}">Error</p></div></span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button type="submit" class="btn btn-default">Find Owner</button>
      </div>
    </div>
  </form>

  <br/>
  <a class="btn btn-default" th:href="@{/owners/new}">Add Owner</a>

  <form th:action="@{/owners/search}" method="get" class="form-horizontal" id="search-by-lastname-form">
    <div class="form-group">
      <div class="control-group">
        <label class="col-sm-2 control-label">Search by Last Name</label>
        <div class="col-sm-10">
          <input type="search" name="lastName" class="form-control" placeholder="Enter last name"/>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button type="submit" class="btn btn-default">Search</button>
      </div>
    </div>
  </form>

</body>
</html>
