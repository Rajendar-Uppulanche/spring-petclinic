<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>
    <th:block th:if="${owner['new']}">New </th:block>Owner
  </h2>

  <form th:object="${owner}" class="form-horizontal" id="add-owner-form" method="post">
    <div class="form-group has-feedback">
      <div class="form-group">
        <label class="col-sm-2 control-label">First Name</label>
        <div class="col-sm-10">
          <input
            class="form-control"
            th:field="*{firstName}"
            th:classappend="${#fields.hasErrors('firstName')} ? 'has-error' : ''"
            type="text"
          />
          <span class="help-inline" th:errors="*{firstName}"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="col-sm-2 control-label">Last Name</label>
        <div class="col-sm-10">
          <input
            class="form-control"
            th:field="*{lastName}"
            th:classappend="${#fields.hasErrors('lastName')} ? 'has-error' : ''"
            type="text"
          />
          <span class="help-inline" th:errors="*{lastName}"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="col-sm-2 control-label">Address</label>
        <div class="col-sm-10">
          <input
            class="form-control"
            th:field="*{address}"
            th:classappend="${#fields.hasErrors('address')} ? 'has-error' : ''"
            type="text"
          />
          <span class="help-inline" th:errors="*{address}"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="col-sm-2 control-label">City</label>
        <div class="col-sm-10">
          <input
            class="form-control"
            th:field="*{city}"
            th:classappend="${#fields.hasErrors('city')} ? 'has-error' : ''"
            type="text"
          />
          <span class="help-inline" th:errors="*{city}"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="col-sm-2 control-label">Telephone</label>
        <div class="col-sm-10">
          <input
            class="form-control"
            th:field="*{telephone}"
            th:classappend="${#fields.hasErrors('telephone')} ? 'has-error' : ''"
            type="text"
            pattern="[0-9]*"
            minlength="10"
            maxlength="15"
            title="Telephone number can only contain digits and must be between 10 and 15 digits long"
          />
          <span class="help-inline" th:errors="*{telephone}"></span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button
          th:with="text=${owner['new']} ? 'Add Owner' : 'Update Owner'"
          class="btn btn-default"
          type="submit"
          th:text="${text}"
        >Add Owner</button>
      </div>
    </div>
  </form>
</body>
</html>
