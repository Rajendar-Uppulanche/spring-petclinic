<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body})}" xmlns:th="https://www.thymeleaf.org">

<body>

  <h2>
    <th:block th:if="${owner['new']}">New </th:block>
    Owner
  </h2>
  <form th:object="${owner}" class="form-horizontal" id="add-owner-form" method="post">
    <div class="form-group has-feedback">
      <div class="form-group">
        <label class="col-sm-2 control-label">First Name</label>
        <div class="col-sm-10">
          <input class="form-control" th:field="*{firstName}" />
          <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="help-inline"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="col-sm-2 control-label">Last Name</label>
        <div class="col-sm-10">
          <input class="form-control" th:field="*{lastName}" />
          <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="help-inline"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="col-sm-2 control-label">Address</label>
        <div class="col-sm-10">
          <input class="form-control" th:field="*{address}" />
          <span th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="help-inline"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="col-sm-2 control-label">City</label>
        <div class="col-sm-10">
          <input class="form-control" th:field="*{city}" />
          <span th:if="${#fields.hasErrors('city')}" th:errors="*{city}" class="help-inline"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="col-sm-2 control-label">Telephone</label>
        <div class="col-sm-10">
          <input class="form-control" th:field="*{telephone}" />
          <span th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}" class="help-inline"></span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button th:if="${owner['new']}" class="btn btn-default" type="submit">Add Owner</button>
        <button th:unless="${owner['new']}" class="btn btn-default" type="submit">Update Owner</button>
      </div>
    </div>
  </form>
</body>

</html>
