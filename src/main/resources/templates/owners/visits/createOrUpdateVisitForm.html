<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>
    <th:block th:if="${visit['new']}">New </th:block>
    Visit
  </h2>

  <form th:object="${visit}" class="form-horizontal" id="add-visit-form" method="post">
    <div class="form-group has-feedback">
      <input th:replace="~{fragments/inputField :: input ('Date', 'date', 'date', null)}" />
      <!-- Original inputField might not be a textarea, so it's replaced directly for description -->
      <div class="form-group">
        <label class="col-sm-2 control-label">Description</label>
        <div class="col-sm-10">
          <textarea class="form-control" id="description" th:field="*{description}" maxlength="500"></textarea>
          <span id="visit-description-char-counter" class="char-counter">500 characters remaining</span>
          <span class="help-inline" th:errors="*{description}">[Error]</span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button th:with="text=${visit['new']} ? 'Add Visit' : 'Update Visit'"
          class="btn btn-default" type="submit" th:text="${text}">Add Visit</button>
      </div>
    </div>
  </form>

  <script th:src="@{/resources/js/visitForm.js}"></script>

</body>
</html>
