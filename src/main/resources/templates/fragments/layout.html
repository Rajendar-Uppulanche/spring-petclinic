<!DOCTYPE html>
<html th:fragment="layout (title,body,activeTab)" xmlns:th="https://www.thymeleaf.org">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title th:text="${title}">PetClinic</title>
  <link rel="stylesheet" href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/webjars/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="/resources/css/petclinic.css" />
  <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
  <script src="/webjars/bootstrap/5.3.2/js/bootstrap.min.js"></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">PetClinic</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item" th:classappend="${activeTab == 'home'} ? 'active'">
            <a class="nav-link" href="/">Home</a>
          </li>
          <li class="nav-item" th:classappend="${activeTab == 'owners'} ? 'active'">
            <a class="nav-link" th:href="@{/owners/find}">Search Owner</a>
          </li>
          <li class="nav-item" th:classappend="${activeTab == 'vets'} ? 'active'">
            <a class="nav-link" th:href="@{/vets.html}">Veterinarians</a>
          </li>
          <li class="nav-item" th:classappend="${activeTab == 'error'} ? 'active'">
            <a class="nav-link" href="/oups">Error</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="container xd-container">
      <th:block th:replace="${body}" />
    </div>
  </div>

  <footer class="container">
    <div class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="navbar-text pull-left">
        <a href="https://www.springframework.org/spring-framework/docs/current/reference/html/web.html#spring-web"
          target="_blank">
          <img src="/resources/images/spring-logo-data.png" alt="Spring Logo" />
        </a>
      </div>
      <div class="navbar-text pull-right">
        <a href="https://www.thymeleaf.org" target="_blank">
          <img src="/resources/images/thymeleaf-logo.png" alt="Thymeleaf Logo" />
        </a>
      </div>
    </div>
  </footer>

</body>

</html>
