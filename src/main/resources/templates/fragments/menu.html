<html xmlns:th="https://www.thymeleaf.org">
<body>
<nav class="navbar navbar-default" role="navigation">
    <div class="container">
        <div class="navbar-header">
            <a class="navbar-brand" th:href="@{/}"><span></span></a>
            <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#main-navbar">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
        </div>
        <div class="navbar-collapse collapse" id="main-navbar">
            <ul class="nav navbar-nav">
                <li th:class="${#strings.startsWith(#httpServletRequest.requestURI,'/owners')} ? active : ''">
                    <a th:href="@{/owners/find}"><i class="fa fa-search"></i> <span>Search Owner</span></a>
                </li>
                <li th:class="${#strings.startsWith(#httpServletRequest.requestURI,'/vets')} ? active : ''">
                    <a th:href="@{/vets}"><i class="fa fa-th-list"></i> <span>Veterinarians</span></a>
                </li>
                <li th:class="${#strings.startsWith(#httpServletRequest.requestURI,'/oups')} ? active : ''">
                    <a th:href="@{/oups}" title="trigger a RuntimeException to see error handling"><i
                            class="fa fa-exclamation-triangle"></i> <span>Error</span></a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
