<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>
    <th:block th:if="${pet['new']}" th:text="#{new}">New </th:block>
    <span th:text="#{pet}">Pet</span>
  </h2>
  <form th:object="${pet}" class="form-horizontal" method="post">
    <input type="hidden" name="id" th:value="*{id}" />
    <div class="form-group has-feedback">
      <div class="form-group">
        <label class="col-sm-2 control-label" th:text="#{owner}">Owner</label>
        <div class="col-sm-10">
          <span th:text="${owner?.firstName + ' ' + owner?.lastName}" />
        </div>
      </div>
      <!-- Inlined fragment for 'Name' input field with title attribute -->
      <div class="form-group" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
        <label class="col-sm-2 control-label" th:text="'Name'">Name</label>
        <div class="col-sm-10">
          <input class="form-control" id="name" name="name" type="text" th:field="*{name}" title="Enter the pet's name" />
          <span class="help-inline" th:each="err : ${#fields.errors('name')}" th:text="${err}">Error</span>
        </div>
      </div>
      <!-- Inlined fragment for 'Birth Date' input field with title attribute -->
      <div class="form-group" th:classappend="${#fields.hasErrors('birthDate')} ? 'has-error'">
        <label class="col-sm-2 control-label" th:text="'Birth Date'">Birth Date</label>
        <div class="col-sm-10">
          <input class="form-control" id="birthDate" name="birthDate" type="date" th:field="*{birthDate}" title="Enter the pet's birth date (YYYY-MM-DD)" />
          <span class="help-inline" th:each="err : ${#fields.errors('birthDate')}" th:text="${err}">Error</span>
        </div>
      </div>
      <!-- Inlined fragment for 'Type' select field with title attribute -->
      <div class="form-group" th:classappend="${#fields.hasErrors('type')} ? 'has-error'">
        <label class="col-sm-2 control-label" th:text="'Type'">Type</label>
        <div class="col-sm-10">
          <select class="form-control" id="type" name="type" th:field="*{type}" title="Select the pet's type">
            <option th:each="option : ${types}" th:value="${option.id}" th:text="${option.name}">Option</option>
          </select>
          <span class="help-inline" th:each="err : ${#fields.errors('type')}" th:text="${err}">Error</span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button th:with="text=${pet['new']} ? 'Add Pet' : 'Update Pet'" class="btn btn-primary" type="submit"
          th:text="${text}">Add Pet</button>
      </div>
    </div>
  </form>

</body>

</html>
