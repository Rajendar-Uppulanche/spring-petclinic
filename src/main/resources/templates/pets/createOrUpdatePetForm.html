<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'pets')}" xmlns:th="https://www.thymeleaf.org">

<body>

  <h2>
    <th:block th:if="${pet['new']}">New </th:block>
    Pet
  </h2>
  <form th:object="${pet}" class="form-horizontal" id="add-pet-form" method="post">
    <div class="form-group has-feedback">
      <div class="form-group">
        <label class="col-sm-2 control-label">Owner</label>
        <div class="col-sm-10">
          <span th:text="${owner.firstName + ' ' + owner.lastName}" />
        </div>
      </div>
      <div class="form-group" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
        <label th:for="name" class="col-sm-2 control-label">Name</label>
        <div class="col-sm-10">
          <input class="form-control" id="name" th:field="*{name}" title="Enter the pet's name" />
          <span class="help-inline" th:errors="*{name}">Error</span>
        </div>
      </div>
      <div class="form-group" th:classappend="${#fields.hasErrors('birthDate')} ? 'has-error'">
        <label th:for="birthDate" class="col-sm-2 control-label">Birth Date</label>
        <div class="col-sm-10">
          <input class="form-control" id="birthDate" th:field="*{birthDate}" title="Enter the pet's birth date in YYYY/MM/DD format" />
          <span class="help-inline" th:errors="*{birthDate}">Error</span>
        </div>
      </div>
      <div class="form-group">
        <label class="col-sm-2 control-label">Type</label>
        <div class="col-sm-10">
          <select th:field="*{type}" class="form-control" title="Select the pet's type">
            <option th:each="type : ${types}" th:object="${type}" th:value="*{id}" th:text="*{name}">
              Type
            </option>
          </select>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button th:with="text=${pet['new']} ? 'Add Pet' : 'Update Pet'" class="btn btn-default" type="submit"
          th:text="${text}">Add Pet</button>
      </div>
    </div>
  </form>

</body>
</html>
