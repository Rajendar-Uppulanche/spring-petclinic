<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>
    <th:block th:if="${pet['new']}" th:text="#{new}">New </th:block>
    <span th:text="#{pet}">Pet</span>
  </h2>
  <form th:object="${pet}" class="form-horizontal" method="post">
    <input type="hidden" name="id" th:value="*{id}" />
    <div class="form-group has-feedback">
      <div class="form-group">
        <label class="col-sm-2 control-label" th:text="#{owner}">Owner</label>
        <div class="col-sm-10">
          <span th:text="${owner?.firstName + ' ' + owner?.lastName}" />
        </div>
      </div>
      <div class="form-group" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
        <label class="col-sm-2 control-label" th:text="'Name'">Name</label>
        <div class="col-sm-10">
          <input th:field="*{name}" type="text" class="form-control" title="Enter the pet's name" />
          <span class="help-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
      </div>
      <div class="form-group" th:classappend="${#fields.hasErrors('birthDate')} ? 'has-error'">
        <label class="col-sm-2 control-label" th:text="'Birth Date'">Birth Date</label>
        <div class="col-sm-10">
          <input th:field="*{birthDate}" type="date" class="form-control" title="Enter the pet's birth date" />
          <span class="help-block" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></span>
        </div>
      </div>
      <div class="form-group" th:classappend="${#fields.hasErrors('type')} ? 'has-error'">
        <label class="col-sm-2 control-label" th:text="'Type'">Type</label>
        <div class="col-sm-10">
          <select th:field="*{type}" class="form-control" title="Select the pet's type">
            <option th:each="type : ${types}" th:value="${type.id}" th:text="${type.name}"></option>
          </select>
          <span class="help-block" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button th:with="text=${pet['new']} ? 'Add Pet' : 'Update Pet'" class="btn btn-primary" type="submit"
          th:text="${text}">Add Pet</button>
      </div>
    </div>
  </form>

</body>

</html>
