<div class="form-group">
    <label for="birthDate">Birth Date</label>
    <input type="date" id="birthDate" th:field="*{birthDate}" class="form-control" th:classappend="${#fields.hasErrors('birthDate')} ? 'is-invalid' : ''"/>
    <span th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}" class="invalid-feedback"></span>
</div>
