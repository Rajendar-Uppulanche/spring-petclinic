<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

	<div class="container-fluid">
		<div class="row">
			<div class="col-md-12">
				<h2>
					<th:block th:if="${visit['new']}">New </th:block>
					Visit
				</h2>
			</div>
		</div>
		<div class="row">
			<div class="col-md-6">
				<form th:object="${visit}" class="form-horizontal" method="post">
					<div class="form-group">
						<label class="col-sm-2 control-label">Pet</label>
						<div class="col-sm-10">
							<span th:text="${pet.name}"></span>
						</div>
					</div>
					<div class="form-group">
						<label class="col-sm-2 control-label">Owner</label>
						<div class="col-sm-10">
							<span th:text="${owner.firstName + ' ' + owner.lastName}"></span>
						</div>
					</div>
					<div class="form-group" th:classappend="${#fields.hasErrors('date')} ? 'has-error'">
						<label for="date" class="col-sm-2 control-label">Date</label>
						<div class="col-sm-10">
							<input th:field="*{date}" type="date" class="form-control" id="date"
								th:min="${minVisitDate}" />
							<span class="help-block" th:if="${#fields.hasErrors('date')}" th:errors="*{date}">
								[errors]
							</span>
						</div>
					</div>
					<div class="form-group" th:classappend="${#fields.hasErrors('description')} ? 'has-error'">
						<label for="description" class="col-sm-2 control-label">Description</label>
						<div class="col-sm-10">
							<input th:field="*{description}" class="form-control" />
							<span class="help-block" th:if="${#fields.hasErrors('description')}"
								th:errors="*{description}">
								[errors]
							</span>
						</div>
					</div>
					<div class="form-group" th:classappend="${#fields.hasErrors('weight')} ? 'has-error'">
						<label for="weight" class="col-sm-2 control-label">Weight (kg)</label>
						<div class="col-sm-10">
							<input th:field="*{weight}" type="number" step="0.01" class="form-control" id="weight"
								placeholder="Optional" />
							<span class="help-block" th:if="${#fields.hasErrors('weight')}" th:errors="*{weight}">
								[errors]
							</span>
						</div>
					</div>
					<div class="form-group">
						<div class="col-sm-offset-2 col-sm-10">
							<button class="btn btn-default" type="submit">Add Visit</button>
						</div>
					</div>
				</form>
			</div>
			</div>
	</div>
</body>

</html>
