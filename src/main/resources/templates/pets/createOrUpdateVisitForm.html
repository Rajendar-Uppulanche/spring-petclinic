<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

	<h2>
		<th:block th:if="${visit['new']}">New </th:block>
		Visit
	</h2>

	<form th:object="${visit}" class="form-horizontal" id="add-visit-form" method="post">
		<div class="form-group has-feedback">
			<div class="form-group">
				<label class="col-sm-2 control-label">Pet</label>
				<div class="col-sm-10">
					<span th:text="${pet.name}" />
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">Owner</label>
				<div class="col-sm-10">
					<span th:text="${owner.firstName + ' ' + owner.lastName}" />
				</div>
			</div>
			<div class="form-group" th:classappend="${#fields.hasErrors('date')} ? 'has-error'">
				<label for="date" class="col-sm-2 control-label">Date</label>
				<div class="col-sm-10">
					<input th:field="*{date}" type="date" class="form-control" th:min="${minVisitDate}" />
					<span class="help-block" th:if="${#fields.hasErrors('date')}" th:errors="*{date}">
						[errors]
					</span>
				</div>
			</div>
			<div class="form-group" th:classappend="${#fields.hasErrors('description')} ? 'has-error'">
				<label for="description" class="col-sm-2 control-label">Description</label>
				<div class="col-sm-10">
					<textarea th:field="*{description}" class="form-control" id="description" maxlength="500"></textarea>
					<span id="visit-description-char-counter" class="char-counter">500 characters remaining</span>
					<span class="help-block" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
						[errors]
					</span>
				</div>
			</div>
		</div>
		<div class="form-group">
			<div class="col-sm-offset-2 col-sm-10">
				<button class="btn btn-default" type="submit">Add Visit</button>
			</div>
			</div>
	</form>
	<script th:src="@{/resources/js/visitForm.js}"></script>
</body>
</html>
