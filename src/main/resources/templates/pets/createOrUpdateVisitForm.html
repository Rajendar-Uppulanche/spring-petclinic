<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>
    <th:block th:if="${visit['new']}" th:text="#{new}">New </th:block>
    Visit
  </h2>

  <b th:text="#{pet}">Pet</b>
  <table class="table table-striped">
    <thead>
      <tr>
        <th th:text="#{name}">Name</th>
        <th th:text="#{birthDate}">Birth Date</th>
        <th th:text="#{type}">Type</th>
        <th th:text="#{owner}">Owner</th>
      </tr>
    </thead>
    <tr>
      <td th:text="${pet.name}"></td>
      <td th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></td>
      <td th:text="${pet.type}"></td>
      <td th:text="${owner?.firstName + ' ' + owner?.lastName}"></td>
    </tr>
  </table>

  <form th:object="${visit}" class="form-horizontal" method="post">
    <div class="form-group has-feedback">
      <input th:replace="~{fragments/inputField :: input ('Date', 'date', 'date')}" />
      <!-- Replaced input with textarea for description -->
      <div class="form-group">
        <label for="visit-description-textarea" th:text="#{description}">Description</label>
        <textarea id="visit-description-textarea" th:field="*{description}" class="form-control" maxlength="500" rows="5"></textarea>
        <span id="visit-description-char-counter" class="char-counter"></span>
        <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="help-block"></span>
      </div>
    </div>

    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <input type="hidden" name="petId" th:value="${pet.id}" />
        <button class="btn btn-primary" type="submit" th:text="#{addVisit}">Add Visit</button>
      </div>
    </div>
  </form>

  <br />
  <b th:text="#{previousVisits}">Previous Visits</b>
  <table class="table table-striped">
    <tr>
      <th th:text="#{date}">Date</th>
      <th th:text="#{description}">Description</th>
    </tr>
    <tr th:if="${!visit['new']}" th:each="visit : ${pet.visits}">
      <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
      <td th:text=" ${visit.description}"></td>
    </tr>
  </table>

  <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
      const descriptionTextarea = document.getElementById('visit-description-textarea');
      const charCounter = document.getElementById('visit-description-char-counter');
      const maxLength = 500;
      const lowRemainingThreshold = 50;

      function updateCharCounter() {
        if (!descriptionTextarea || !charCounter) {
          return; // Exit if elements are not found
        }
        const currentLength = descriptionTextarea.value.length;
        const remaining = maxLength - currentLength;
        charCounter.textContent = remaining + ' characters remaining';

        if (remaining < lowRemainingThreshold) {
          charCounter.classList.add('char-counter-low');
        } else {
          charCounter.classList.remove('char-counter-low');
        }
      }

      if (descriptionTextarea && charCounter) {
        descriptionTextarea.addEventListener('input', updateCharCounter);
        // Initialize on page load
        updateCharCounter();
      }
    });
  </script>

</body>

</html>
