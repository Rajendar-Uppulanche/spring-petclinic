<html xmlns:th="https://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">

<head>
    <title>New Visit</title>
</head>

<body>

    <div layout:fragment="content">
        <h2>
            <th:block th:if="${visit['new']}">New</th:block> Visit
        </h2>
        <form th:object="${visit}" class="form-horizontal" id="add-visit-form" method="post">
            <div class="form-group has-feedback">
                <div class="form-group">
                    <label class="col-sm-2 control-label">Pet</label>
                    <div class="col-sm-10">
                        <span th:text="${pet.name}"></span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">Owner</label>
                    <div class="col-sm-10">
                        <span th:text="${owner.firstName + ' ' + owner.lastName}"></span>
                    </div>
                </div>
                <input
                    th:field="*{date}"
                    th:value="${#temporals.format(visit.date, 'yyyy-MM-dd')}"
                    type="date"
                    class="form-control"
                    id="date"
                    name="date"
                />
                <div class="form-group">
                    <label class="col-sm-2 control-label">Description</label>
                    <div class="col-sm-10">
                        <textarea class="form-control" th:field="*{description}" maxlength="500" id="visitDescription"></textarea>
                        <span id="visitDescriptionCharCounter" class="char-counter">500 characters remaining</span>
                        <span class="help-inline" th:errors="*{description}"></span>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <div class="col-sm-offset-2 col-sm-10">
                    <button class="btn btn-default" type="submit">Add Visit</button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
