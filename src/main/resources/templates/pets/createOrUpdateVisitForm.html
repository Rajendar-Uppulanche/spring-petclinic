<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <style>
    .form-horizontal label {
      font-weight: 600;
    }
    .btn-success-custom {
      background-color: #28A745;
      color: white;
      border-color: #28A745;
    }
    .btn-success-custom:hover {
      background-color: #218838;
      border-color: #1e7e34;
    }
  </style>

  <h2>
    <th:block th:if="${visit['new']}" th:text="#{new}">New </th:block>
    Visit
  </h2>

  <b th:text="#{pet}">Pet</b>
  <table class="table table-striped">
    <thead>
      <tr>
        <th th:text="#{name}">Name</th>
        <th th:text="#{birthDate}">Birth Date</th>
        <th th:text="#{type}">Type</th>
        <th th:text="#{owner}">Owner</th>
      </tr>
    </thead>
    <tr>
      <td th:text="${pet.name}"></td>
      <td th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></td>
      <td th:text="${pet.type}"></td>
      <td th:text="${owner?.firstName + ' ' + owner?.lastName}"></td>
    </tr>
  </table>

  <form th:object="${visit}" class="form-horizontal" method="post" style="background-color: #EBF5FB; padding: 20px; border-radius: 5px;">
    <div class="form-group has-feedback">
      <input th:replace="~{fragments/inputField :: input ('Appointment Date', 'date', 'date')}" />
      <input th:replace="~{fragments/inputField :: input ('Reason for Visit', 'description', 'text')}" />
    </div>

    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <input type="hidden" name="petId" th:value="${pet.id}" />
        <button class="btn btn-success-custom" type="submit" th:text="#{addVisit}">Add Visit</button>
        <a th:href="@{/owners/{ownerId}(ownerId=${owner.id})}" style="color: #6C757D; text-decoration: none; margin-left: 10px;">Cancel</a>
      </div>
    </div>
  </form>

  <br />
  <b th:text="#{previousVisits}">Previous Visits</b>
  <table class="table table-striped">
    <tr>
      <th th:text="#{date}">Date</th>
      <th th:text="#{description}">Description</th>
    </tr>
    <tr th:if="${!visit['new']}" th:each="visit : ${pet.visits}">
      <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
      <td th:text=" ${visit.description}"></td>
    </tr>
  </table>

</body>

</html>
