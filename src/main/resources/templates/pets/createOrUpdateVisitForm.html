<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'owners')}" xmlns:th="https://www.thymeleaf.org">

<body>

  <h2>
    <th:block th:if="${visit['new']}">New </th:block>
    Visit
  </h2>

  <form th:object="${visit}" class="form-horizontal" method="post">
    <div class="form-group has-feedback">
      <div class="form-group">
        <label class="col-sm-2 control-label">Pet</label>
        <div class="col-sm-10">
          <span th:text="${pet.name}"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="col-sm-2 control-label">Owner</label>
        <div class="col-sm-10">
          <span th:text="${owner.firstName + ' ' + owner.lastName}"></span>
        </div>
      </div>
      <div class="form-group" th:classappend="${#fields.hasErrors('date')} ? 'has-error'">
        <label for="date" class="col-sm-2 control-label">Date</label>
        <div class="col-sm-10">
          <input th:field="*{date}" type="date" class="form-control" />
          <span class="help-inline" th:errors="*{date}">[errors]</span>
        </div>
      </div>
      <div class="form-group" th:classappend="${#fields.hasErrors('description')} ? 'has-error'">
        <label for="description" class="col-sm-2 control-label">Reason for Visit</label>
        <div class="col-sm-10">
          <textarea th:field="*{description}" class="form-control" maxlength="500"></textarea>
          <div id="description-char-counter" class="char-counter">500 characters remaining</div>
          <span class="help-inline" th:errors="*{description}">[errors]</span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button class="btn btn-default" type="submit">Add Visit</button>
      </div>
    </div>
  </form>

  <br />
  <b>Previous Visits</b>:
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Date</th>
        <th>Description</th>
      </tr>
    </thead>
    <tr th:if="${!pet.visits.empty}" th:each="visit : ${pet.visits}">
      <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
      <td th:text="${visit.description}"></td>
    </tr>
    <tr th:if="${pet.visits.empty}">
      <td>No visits</td>
      <td></td>
    </tr>
  </table>

  <script th:src="@{/resources/js/character_counter.js}"></script>

</body>

</html>
