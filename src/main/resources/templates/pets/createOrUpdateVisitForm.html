<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

	<h2>
		<th:block th:if="${visit['new']}">New </th:block>
		Visit
	</h2>

	<div class="visit-form-card">
		<form th:object="${visit}" class="form-horizontal" id="add-visit-form" method="post">
			<div class="form-group has-feedback">
				<div class="form-group">
					<label class="col-sm-2 control-label">Pet</label>
					<div class="col-sm-10">
						<span th:text="${pet.name}"></span>
					</div>
				</div>
				<div class="form-group">
					<label class="col-sm-2 control-label">Owner</label>
					<div class="col-sm-10">
						<span th:text="${owner.firstName + ' ' + owner.lastName}"></span>
					</div>
				</div>
				<div class="form-group" th:classappend="${#fields.hasErrors('date')} ? 'has-error'">
					<label for="date" class="col-sm-2 control-label">Appointment Date</label>
					<div class="col-sm-10">
						<input th:field="*{date}" type="date" class="form-control" />
						<span class="help-block" th:each="error : ${#fields.errors('date')}" th:text="${error}"></span>
					</div>
				</div>
				<div class="form-group" th:classappend="${#fields.hasErrors('description')} ? 'has-error'">
					<label for="description" class="col-sm-2 control-label">Reason for Visit</label>
					<div class="col-sm-10">
						<input th:field="*{description}" class="form-control" />
						<span class="help-block" th:each="error : ${#fields.errors('description')}" th:text="${error}"></span>
					</div>
				</div>
			</div>
			<div class="form-group">
				<div class="col-sm-offset-2 col-sm-10">
					<button class="btn btn-success" type="submit">Add Visit</button>
					<a class="cancel-link" th:href="@{/owners/{ownerId}(ownerId=${owner.id})}">Cancel</a>
				</div>
			</div>
		</form>
	</div>

</body>
</html>
