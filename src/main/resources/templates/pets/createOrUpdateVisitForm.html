<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>
    <th:block th:if="${visit['new']}" th:text="#{new}">New </th:block>
    Visit
  </h2>

  <b th:text="#{pet}">Pet</b>
  <table class="table table-striped">
    <thead>
      <tr>
        <th th:text="#{name}">Name</th>
        <th th:text="#{birthDate}">Birth Date</th>
        <th th:text="#{type}">Type</th>
        <th th:text="#{owner}">Owner</th>
      </tr>
    </thead>
    <tr>
      <td th:text="${pet.name}"></td>
      <td th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></td>
      <td th:text="${pet.type}"></td>
      <td th:text="${owner?.firstName + ' ' + owner?.lastName}"></td>
    </tr>
  </table>

  <form th:object="${visit}" class="form-horizontal" method="post">
    <div class="form-group has-feedback">
      <input th:replace="~{fragments/inputField :: input ('Date', 'date', 'date')}" />
      <!-- Replaced the inputField fragment for description with a textarea and character counter -->
      <div class="form-group has-feedback" th:classappend="${#fields.hasErrors('description')} ? 'has-error'">
          <label class="col-sm-2 control-label">Description</label>
          <div class="col-sm-10">
              <textarea class="form-control" th:field="*{description}" id="description" maxlength="500"></textarea>
              <span class="help-inline" th:each="err : ${#fields.errors('description')}" th:text="${err}"></span>
              <span id="descriptionCharCounter" class="char-counter">500 characters remaining</span>
          </div>
      </div>
    </div>

    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <input type="hidden" name="petId" th:value="${pet.id}" />
        <button class="btn btn-primary" type="submit" th:text="#{addVisit}">Add Visit</button>
      </div>
    }
  </form>

  <br />
  <b th:text="#{previousVisits}">Previous Visits</b>
  <table class="table table-striped">
    <tr>
      <th th:text="#{date}">Date</th>
      <th th:text="#{description}">Description</th>
    </tr>
    <tr th:if="${!visit['new']}" th:each="visit : ${pet.visits}">
      <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
      <td th:text=" ${visit.description}"></td>
    </tr>
  </table>

  <!-- CSS for character counter -->
  <style>
      .char-counter {
          font-size: 0.9em;
          color: #6c757d; /* Bootstrap's secondary text color */
          display: block;
          margin-top: 5px;
      }
      .char-counter.warning {
          color: #DC3545; /* Red color for warning */
          font-weight: bold;
      }
  </style>

  <!-- JavaScript for character counting -->
  <script>
      document.addEventListener('DOMContentLoaded', function() {
          const descriptionTextarea = document.getElementById('description');
          const charCounterSpan = document.getElementById('descriptionCharCounter');
          const maxLength = 500;

          function updateCharCounter() {
              const currentLength = descriptionTextarea.value.length;
              const remaining = maxLength - currentLength;
              charCounterSpan.textContent = remaining + ' characters remaining';

              if (remaining <= 50) {
                  charCounterSpan.classList.add('warning');
              } else {
                  charCounterSpan.classList.remove('warning');
              }
          }

          // Initial update
          updateCharCounter();

          // Update on input
          descriptionTextarea.addEventListener('input', updateCharCounter);
      });
  </script>

</body>

</html>
