<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'owners')}" xmlns:th="https://www.thymeleaf.org">

<body>

  <h2>Visit</h2>

  <form th:object="${visit}" class="form-horizontal" id="add-visit-form" method="post" style="background-color: #EBF5FB; padding: 20px; border-radius: 5px;">
    <div class="form-group has-feedback">
      <div class="form-group">
        <label class="col-sm-2 control-label" style="font-weight: 600;">Pet</label>
        <div class="col-sm-10">
          <span th:text="${pet.name}"></span>
        </div>
      </div>
      <div class="form-group">
        <label class="col-sm-2 control-label" style="font-weight: 600;">Owner</label>
        <div class="col-sm-10">
          <span th:text="${owner.firstName + ' ' + owner.lastName}"></span>
        </div>
      </div>
      <div class="form-group" th:classappend="${#fields.hasErrors('date')} ? 'has-error'">
        <label for="date" class="col-sm-2 control-label" style="font-weight: 600;">Appointment Date</label>
        <div class="col-sm-10">
          <input th:field="*{date}" type="date" class="form-control" />
          <span class="glyphicon glyphicon-ok form-control-feedback" aria-hidden="true"></span>
          <span th:each="err : ${#fields.errors('date')}" th:text="${err}" class="help-block">
            [Error]
          </span>
        </div>
      </div>
      <div class="form-group" th:classappend="${#fields.hasErrors('description')} ? 'has-error'">
        <label for="description" class="col-sm-2 control-label" style="font-weight: 600;">Reason for Visit</label>
        <div class="col-sm-10">
          <input th:field="*{description}" class="form-control" />
          <span class="glyphicon glyphicon-ok form-control-feedback" aria-hidden="true"></span>
          <span th:each="err : ${#fields.errors('description')}" th:text="${err}" class="help-block">
            [Error]
          </span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button class="btn btn-default" type="submit" style="background-color: #28A745; color: white;">Add Visit</button>
        <a style="color: #6C757D; text-decoration: none;" th:href="@{/owners/{ownerId}(ownerId=${owner.id})}">Cancel</a>
      </div>
    </div>
  </form>

</body>
</html>
