<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12">
        <h2 th:text="#{addVisit}">Add Visit</h2>
        <form th:object="${visit}" class="form-horizontal" method="post">
          <div class="form-group has-feedback">
            <div class="form-group">
              <label class="col-sm-2 control-label" th:text="#{pet}">Pet</label>
              <div class="col-sm-10">
                <span th:text="${pet.name}"></span>
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-2 control-label" th:text="#{owner}">Owner</label>
              <div class="col-sm-10">
                <span th:text="${owner.firstName + ' ' + owner.lastName}"></span>
              </div>
            </div>
            <div class="form-group" th:classappend="${#fields.hasErrors('date')} ? 'has-error'">
              <label for="date" class="col-sm-2 control-label" th:text="#{date}">Date</label>
              <div class="col-sm-10">
                <input id="date" type="text" th:field="*{date}" class="form-control" />
                <span class="help-block" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
              </div>
            </div>
            <div class="form-group" th:classappend="${#fields.hasErrors('description')} ? 'has-error'">
              <label for="description" class="col-sm-2 control-label" th:text="#{description}">Description</label>
              <div class="col-sm-10">
                <input id="description" type="text" th:field="*{description}" class="form-control" />
                <span class="help-block" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
              </div>
            </div>
            <!-- New field for weight -->
            <div class="form-group" th:classappend="${#fields.hasErrors('weight')} ? 'has-error'">
              <label for="weight" class="col-sm-2 control-label" th:text="#{weight}">Weight (kg)</label>
              <div class="col-sm-10">
                <input id="weight" type="number" step="0.01" th:field="*{weight}" class="form-control" placeholder="Optional" />
                <span class="help-block" th:if="${#fields.hasErrors('weight')}" th:errors="*{weight}"></span>
              </div>
            </div>
          </div>
          <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
              <button class="btn btn-primary" type="submit" th:text="#{addVisit}">Add Visit</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
