<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Veterinarians List</title>
    <link rel="stylesheet" href="/css/main.css"> 
</head>
<body>
    <div class="container">
        <h1>Our Veterinarians</h1>

        <div class="filter-section">
            <label for="specialtyFilter">Filter by Specialty:</label>
            <select id="specialtyFilter">
                <option value="all">All Specialties</option>
                
            </select>
        </div>

        <table id="vetTable">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Specialties</th>
                </tr>
            </thead>
            <tbody>
                
                <tr th:each="vet : ${vets}">
                    <td th:text="${vet.firstName}"></td>
                    <td th:text="${vet.lastName}"></td>
                    <td>
                        <span th:each="specialty, iterStat : ${vet.specialties}">
                            <span th:text="${specialty.name}"></span><span th:if="${!iterStat.last}">, </span>
                        </span>
                        <span th:if="${vet.specialties.isEmpty()}">None</span>
                    </td>
                </tr>
            </tbody>
        </table>

        <p id="noVetsMessage" style="display: none; color: gray;">No veterinarians found for the selected specialty.</p>
        <p id="noSpecialtiesMessage" style="display: none; color: gray;">No specialties available for filtering.</p>

        <p><a href="/">Back to Home</a></p>
    </div>

    <script src="/js/vetList.js"></script>
</body>
</html>
