<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout (~{::body},'vets')}">

  <body>

    <h2>Veterinarians</h2>

    <div class="form-group">
      <label for="specialtyFilter">Filter by Specialty:</label>
      <select id="specialtyFilter" class="form-control">
        <option value="">All specialties</option>
        <option th:each="specialty : ${specialties}" th:value="${specialty.name}" th:text="${specialty.name}"></option>
      </select>
    </div>

    <table id="vets" class="table table-striped">
        <thead>
        <tr>
            <th>Name</th>
            <th>Specialties</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="vet : ${listVets}" th:data-specialties="${#strings.listJoin(vet.specialties.![name], ',')}">
            <td th:text="${vet.firstName + ' ' + vet.lastName}"></td>
            <td><span th:each="specialty : ${vet.specialties}" th:text="${specialty.name + ' '}"></span></td>
        </tr>
        </tbody>
    </table>

    <table class="table-buttons">
        <tr>
            <td>
                <a th:if="${currentPage > 1}" th:href="@{/vets.html(page=${currentPage - 1})}" class="btn btn-default">Previous</a>
            </td>
            <td>
                <span th:text="${currentPage} + ' of ' + ${totalPages}"></span>
            </td>
            <td>
                <a th:if="${currentPage < totalPages}" th:href="@{/vets.html(page=${currentPage + 1})}" class="btn btn-default">Next</a>
            </td>
        </tr>
    </table>

    <div id="noVetsFound" style="display: none; color: red;">No veterinarians found matching the selected specialty.</div>

    <script src="/resources/js/vet-filter.js"></script>

  </body>
</html>
