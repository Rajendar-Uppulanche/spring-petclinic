<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'vets')}">

  <body>

    <h2>Veterinarians</h2>

    <table id="vets" class="table table-striped">
      <thead>
        <tr>
          <th style="width: 150px;">Name</th>
          <th style="width: 200px;">Specialties</th> <!-- New column for specialties -->
        </tr>
      </thead>
      <tbody>
        <tr th:each="vet : ${listVets}">
          <td th:text="${vet.firstName + ' ' + vet.lastName}"></td>
          <td>
            <span th:each="specialty : ${vet.specialties}"
                  th:text="${specialty.name}"
                  th:classappend="${#strings.toLowerCase(specialty.name) == 'radiology' ? 'badge-radiology' :
                                 (#strings.toLowerCase(specialty.name) == 'surgery' ? 'badge-surgery' :
                                 (#strings.toLowerCase(specialty.name) == 'dentistry' ? 'badge-dentistry' :
                                 (#strings.toLowerCase(specialty.name) == 'internal medicine' ? 'badge-internal-medicine' :
                                 'badge-other')))}"
                  class="badge-specialty"></span>
            <span th:if="${vet.specialties.empty}" class="badge-general-practice badge-specialty">General Practice</span>
          </td>
        </tr>
      </tbody>
    </table>

    <div th:replace="~{fragments/pagination :: pagination(${currentPage}, ${totalPages}, ${totalItems}, '/vets.html')}"></div>

  </body>
</html>
