<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add/Update Visit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="visit-form-container">
        <h2>Add New Visit</h2>
        <form action="/visits" method="post">
            <div class="form-group">
                <label for="visitDate">Appointment Date:</label>
                <input type="date" id="visitDate" name="visitDate" required>
            </div>
            <div class="form-group">
                <label for="description">Reason for Visit:</label>
                <textarea id="description" name="description" rows="4" required></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="add-visit-button">Add Visit</button>
                <a href="/visits" class="cancel-link">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
